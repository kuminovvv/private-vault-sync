name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: plugin/package-lock.json
      - name: Prepare Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt && rustup default stable
      - name: Check Rust formatting
        working-directory: server
        run: cargo fmt --check
      - name: Build server
        working-directory: server
        run: cargo build --locked
      - name: Build plugin
        working-directory: plugin
        run: |
          npm ci
          npm run build
      - name: Integration tests
        run: |
          exe=./server/target/debug/private-sync
          if [[ "$RUNNER_OS" == Windows ]]; then exe="$exe.exe"; fi
          node tests/integration.mjs "$exe"
          node tests/client.mjs "$exe"
          SYNC_TEST_ENCRYPTED=1 SYNC_TEST_FILES=12 node tests/client.mjs "$exe"
      - name: Backup and restore test
        if: matrix.os == 'ubuntu-latest'
        run: python3 tests/backup_test.py
      - name: Upload test plugin
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: private-vault-sync-plugin
          path: |
            plugin/main.js
            plugin/manifest.json
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: private-vault-sync-plugin
          path: release
      - name: Publish verified beta assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(node -p 'require("./release/manifest.json").version')"
          test "v$version" = "$GITHUB_REF_NAME"
          (cd release && zip -q private-vault-sync.zip main.js manifest.json)
          gh release create "$GITHUB_REF_NAME" release/main.js release/manifest.json release/private-vault-sync.zip --verify-tag --prerelease --title "Private Vault Sync $version (beta)" --notes 'Experimental encrypted synchronization. Use a separate backup; not independently security-audited. Read README and SECURITY before connecting.'
