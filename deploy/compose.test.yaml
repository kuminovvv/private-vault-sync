services:
  private-sync:
    build:
      context: ..
      dockerfile: Dockerfile
    image: private-vault-sync:pilot
    restart: unless-stopped
    user: "10001:10001"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    mem_limit: 512m
    cpus: 1.5
    pids_limit: 128
    environment:
      SYNC_DATA: /data
      SYNC_BIND: 0.0.0.0:8877
      SYNC_QUOTA_BYTES: "2147483648"
    volumes:
      - ./data:/data
    networks:
      - proxy
networks:
  proxy:
    external: true
    name: ${SYNC_PROXY_NETWORK:?Set SYNC_PROXY_NETWORK in the deployment environment}
